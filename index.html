                            <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Погода в Московском</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to bottom right, #e0f7fa, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .weather-card {
            background: #fff8e1;
            border-radius: 20px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            padding: 35px;
            text-align: center;
            width: 280px;
            position: relative;
            overflow: hidden;
        }
        .temperature {
            font-size: 2.2em;
            color: #ff5722;
            margin: 15px 0;
        }
        .description {
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #5d4037;
            margin-bottom: 15px;
            font-weight: 500;
        }
        .emoji {
            font-size: 2em;
            margin-bottom: 10px;
        }
        marquee {
            width: 100%;
            background: #ffeb3b;
            color: #c2185b;
            font-weight: bold;
            font-size: 1.1em;
            padding: 8px 0;
            border-radius: 10px;
            margin-top: 15px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="weather-card">
        <h2>🏙️ Московский</h2>
        <div class="emoji">🌤️</div>
        <div class="temperature">+5°C</div>
        <div class="description">ясно</div>
        <marquee behavior="scroll" direction="left" scrollamount="5">IT'S ШАШЛЫКI TIME</marquee>
    </div>
</body>
</html>
